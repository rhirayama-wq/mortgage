name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    name: typecheck / lint / unit / build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-key
          APP_ORIGIN: http://localhost:3000

  pg-harness:
    name: PostgreSQL harness (migration + RLS/GRANT/concurrency)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Run harness
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5433"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: bash scripts/pg-harness/run.sh

  # NOTE: 実Supabase（supabase start / PostgREST / GoTrue / Inbucket）検証は
  # Docker-in-Docker 構成の別 workflow として Phase 1 完了までに追加する。
  # 本番 Supabase へは接続しない。
