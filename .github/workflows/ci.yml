name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    name: typecheck / lint / unit / build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      # package-lock.json は npm 11.12.1 で生成（lockfileVersion 3）。
      # Node 22 同梱の npm 10 は、npm 11 が lockfile へ書き込む「version 欠落の optional
      # スタブ」（unrs-resolver の未対応プラットフォーム向けバインディング
      # @unrs/resolver-binding-openharmony-arm64）を解釈できず `npm ci` が
      # "Invalid Version:" で失敗する。lockfile 生成元と同一の npm 11.12.1 へ固定する
      # （app/package.json の packageManager と必ず一致させること）。
      - name: Pin npm to lockfile-generating version
        run: npm install -g npm@11.12.1
      - name: Show toolchain versions
        run: node --version && npm --version
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-key
          APP_ORIGIN: http://localhost:3000

  pg-harness:
    name: PostgreSQL harness (migration + RLS/GRANT/concurrency)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - name: Run harness
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5433"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: bash scripts/pg-harness/run.sh

  # NOTE: 実 Supabase（supabase start / PostgREST / GoTrue / Mailpit）検証は、
  # 別 workflow `.github/workflows/supabase-local-e2e.yml` として追加済み。
  # GitHub-hosted runner に既定で用意されている Docker daemon をそのまま利用し
  # （Docker-in-Docker 構成ではない）、`supabase start` / `supabase db reset` の後に
  # `npm run verify:supabase` と `npm run e2e:local` を実行する。
  # 本番 Supabase へは接続しない。接続先は loopback（127.0.0.1 / localhost / [::1]）のみで、
  # Supabase の鍵をリポジトリ Secrets に置かない（参照するのは CLI 取得用に
  # 自動発行される GITHUB_TOKEN のみ）。
  # 本 workflow（typecheck / lint / unit / build / PostgreSQL harness）は
  # 高速 quality gate として据え置く。
